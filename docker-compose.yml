version: '3.8'

services:
  dwpts-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dwpts-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=dwpts_prod;Username=dwpts_user;Password=dwpts_secure_password_2026;
      - Jwt__Key=DWPTS_ENTERPRISE_JWT_SUPER_SECRET_SIGNING_KEY_2026_PRODUCTION
      - Redis__ConnectionString=redis:6379
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - dwpts-network
    restart: unless-stopped

  dwpts-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: dwpts-client
    ports:
      - "80:80"
    depends_on:
      - dwpts-api
    networks:
      - dwpts-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: dwpts-postgres
    environment:
      POSTGRES_DB: dwpts_prod
      POSTGRES_USER: dwpts_user
      POSTGRES_PASSWORD: dwpts_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dwpts-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dwpts-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - dwpts-network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dwpts-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - dwpts-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dwpts-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - dwpts-network

volumes:
  pgdata:
  redisdata:

networks:
  dwpts-network:
    driver: bridge
