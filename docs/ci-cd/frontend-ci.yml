name: Angular 18 Frontend CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: client/dwpts-angular/package-lock.json

    - name: Install NPM Dependencies
      working-directory: client/dwpts-angular
      run: npm ci

    - name: Compile Angular 18 Production Bundle
      working-directory: client/dwpts-angular
      run: npm run build
