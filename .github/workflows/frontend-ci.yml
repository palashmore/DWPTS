name: Frontend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: client/dwpts-angular/package-lock.json

    - name: Install dependencies
      working-directory: client/dwpts-angular
      run: npm ci

    - name: Build Angular Application
      working-directory: client/dwpts-angular
      run: npm run build -- --configuration production
